[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "MolToken"
version = "0.1.0"
description = "Unified heavy-atom graph tokenization and autoregressive molecular modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<2", "networkx>=3,<4", "rdkit>=2023.9",
  "numba>=0.58", "PyYAML>=6", "orjson>=3", "scipy>=1.10"
]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers==4.57.6", "accelerate>=0.33",
         "safetensors>=0.4", "pyarrow>=14", "pandas>=2", "tqdm>=4.66"]
data = ["pyarrow>=14", "pandas>=2", "zstandard>=0.22"]
bio-eval = ["rapidfuzz>=3", "biopython>=1.81", "nltk>=3.8", "scikit-learn>=1.3", "pandas>=2"]
test = ["pytest>=8", "build>=1", "Pillow>=10", "rapidfuzz>=3", "biopython>=1.81"]
analysis = ["matplotlib>=3.8", "pandas>=2"]

[project.scripts]
moltoken = "moltoken.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moltoken*", "pipeline*", "cli*", "src*", "tools*", "configs*", "experiments*"]
exclude = ["tests*", "build*", "dist*"]
namespaces = true

[tool.setuptools.package-data]
moltoken = ["assets/fddfs_bpe/*.json", "assets/fddfs_bpe/*.csv"]
"pipeline.serialization" = ["*.cpp"]
"src.algorithms.compression" = ["*.cpp"]
"cli.evaluate" = ["*.R"]
"cli.data" = ["*.txt"]
configs = ["**/*.yaml", "**/*.txt", "**/*.json"]
"tools.yttm_int_bpe" = ["LICENSE", "tools/*.py", "tools/*.cpp", "tools/*.sh",
                       "youtokentome/cpp/third_party/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
